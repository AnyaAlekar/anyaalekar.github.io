<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="bar__inner wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author }}</a>
    <nav class="nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign current = false %}
        {% if item.url == '/' and page.url == '/' %}{% assign current = true %}
        {% elsif item.url != '/' and page.url contains item.url %}{% assign current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="jump" id="open-palette" type="button" aria-label="Open quick jump">
      <span class="jump__label">Jump to</span><kbd id="kbd-hint">Ctrl K</kbd>
    </button>
  </div>
</header>
